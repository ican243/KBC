; KBC아카데미 전용 PHP-FPM pool
; 다른 사이트(www pool)와 분리해 KBC 에만 업로드 한도와 접근 범위를 적용한다.
[kbc]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-kbc.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; 강사 사진 업로드 (앱에서 5MB 로 한 번 더 제한)
php_admin_value[upload_max_filesize] = 6M
php_admin_value[post_max_size] = 8M

; KBC 폴더와 임시 폴더 밖의 파일은 읽고 쓰지 못하게 (다른 사이트 파일 보호)
php_admin_value[open_basedir] = /var/www/kbc/:/tmp/
