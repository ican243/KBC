# KBC 관리자 (CodeIgniter4)
# server_name을 명시해야 king-custom-domains(80 default_server)로 빠지지 않는다.
server {
    listen 80;
    listen [::]:80;
    server_name admin.kbc.test;

    root /var/www/kbc/admin/public;
    index index.php;

    access_log /var/log/nginx/kbc-admin.access.log;
    error_log  /var/log/nginx/kbc-admin.error.log;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known) { deny all; }
}
