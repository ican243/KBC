# KBC - kir1.cafe24.com/kbc/ (공개 홈페이지), /kbc/admin/ (관리자) 하위경로 (CodeIgniter4)
# lambda 443 server 블록에서 include 한다. 도메인 연결 후에는 include 줄만 제거하면 된다.

location = /kbc {
    return 301 /kbc/;
}

# ^~ : lambda의 정규식 location(.php, 숨김파일)보다 우선 적용
location ^~ /kbc/ {
    alias /var/www/kbc/user/public/;
    index index.php;

    auth_basic "KBC";
    auth_basic_user_file /etc/nginx/.htpasswd-kbc;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # 우리 서버의 스크립트만 실행 (XSS 피해 차단)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # 실제 파일(css, js, 이미지)은 바로 응답, 없으면 CI4로 전달
    try_files $uri $uri/ @kbc_front;

    location ~ /\. { deny all; }

    # CI4 입구
    location = /kbc/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/kbc/user/public/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-kbc.sock;  # KBC 전용 pool
    }

    # index.php 외 PHP 파일은 실행/노출하지 않음
    location ~ \.php$ { return 404; }
}

location @kbc_front {
    rewrite ^ /kbc/index.php last;
}

# ---------------------------------------------------------------
# KBC 관리자 - /kbc/admin/  (/kbc/ 보다 긴 경로라 이 블록이 우선 적용)
# ---------------------------------------------------------------
location = /kbc/admin {
    return 301 /kbc/admin/;
}

location ^~ /kbc/admin/ {
    alias /var/www/kbc/admin/public/;
    index index.php;

    # 강사 사진 업로드 (관리자에만 허용, 기본 1MB)
    client_max_body_size 8m;

    auth_basic "KBC";
    auth_basic_user_file /etc/nginx/.htpasswd-kbc;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    try_files $uri $uri/ @kbc_admin_front;

    location ~ /\. { deny all; }

    location = /kbc/admin/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/kbc/admin/public/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-kbc.sock;  # KBC 전용 pool
    }

    location ~ \.php$ { return 404; }
}

location @kbc_admin_front {
    rewrite ^ /kbc/admin/index.php last;
}
