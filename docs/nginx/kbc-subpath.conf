# KBC 공개 홈페이지 - kir1.cafe24.com/kbc/ 하위경로 (CodeIgniter4)
# lambda 443 server 블록에서 include 한다. 도메인 연결 후에는 include 줄만 제거하면 된다.

location = /kbc {
    return 301 /kbc/;
}

# ^~ : lambda의 정규식 location(.php, 숨김파일)보다 우선 적용
location ^~ /kbc/ {
    alias /var/www/kbc/user/public/;
    index index.php;

    auth_basic "KBC";
    auth_basic_user_file /etc/nginx/.htpasswd-kbc;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 실제 파일(css, js, 이미지)은 바로 응답, 없으면 CI4로 전달
    try_files $uri $uri/ @kbc_front;

    location ~ /\. { deny all; }

    # CI4 입구
    location = /kbc/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/kbc/user/public/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # index.php 외 PHP 파일은 실행/노출하지 않음
    location ~ \.php$ { return 404; }
}

location @kbc_front {
    rewrite ^ /kbc/index.php last;
}
